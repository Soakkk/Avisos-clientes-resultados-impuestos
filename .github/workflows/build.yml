name: Pruebas y ejecutable Windows

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar la versión de package.json como release (crea la etiqueta vX.Y.Z)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar TypeScript
        run: npm run lint
      - name: Probar reglas fiscales
        run: npm test
      - name: Compilar aplicación web
        run: npm run build

  build:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar TypeScript en Windows
        run: npm run lint
      - name: Ejecutar pruebas en Windows
        run: npm test
      - name: Compilar instalador NSIS
        run: npm run electron:build
      - name: Verificar metadatos del autoactualizador
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist-electron -Filter *.exe
          $yml = Get-ChildItem dist-electron -Filter latest.yml
          $blockmap = Get-ChildItem dist-electron -Filter *.blockmap
          if (-not $exe -or -not $yml -or -not $blockmap) { throw "Faltan assets requeridos por electron-updater" }
      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Generador-Avisos-Fiscales-Setup
          path: |
            dist-electron/*.exe
            dist-electron/*.yml
            dist-electron/*.blockmap
      - name: Leer versión
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Publicar release
        # Con una etiqueta vX.Y.Z, o a mano desde Actions marcando «publicar»:
        # en ese caso la etiqueta se crea con la versión de package.json.
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publicar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist-electron/*.exe
            dist-electron/*.yml
            dist-electron/*.blockmap
          generate_release_notes: true
